<!doctype html>
<html lang="fr">
<head>
  <!--
    Page de connexion, servie à la racine du site ("/"). Redirige vers
    admin.html ou stock.html selon le rôle renvoyé par POST /api/auth/login
    (voir js/auth.js). La page publique de recherche/chat est catalogue.html,
    atteinte uniquement via son URL directe (pas de lien depuis ici).
  -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion – Stock and CO</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>Stock and CO</h1>
    <p class="app-sub">Connectez-vous pour accéder à votre espace.</p>

    <form id="login-form" class="auth-form">
      <label for="identifier">Identifiant</label>
      <input type="text" id="identifier" name="identifier" placeholder="Email ou nom d'utilisateur" autocomplete="username" required />

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <p class="form-error" id="login-error" hidden></p>

      <button type="submit">Se connecter</button>
    </form>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
