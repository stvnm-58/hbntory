<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock and CO</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="login-link" href="login.html">Connexion</a>

  <header class="app-header">
    <h1>Stock and CO</h1>
    <p class="app-sub">Recherchez dans le stock ou posez une question.</p>
  </header>

  <main>
    <section class="view">
      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Rechercher un produit, une succursale…" />
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Produit</th>
              <th>id</th>
              <th>Qté</th>
              <th>Détails</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
        <p class="empty-state" id="empty-state">Aucun résultat pour l'instant. Lancez une recherche.</p>
      </div>
    </section>
  </main>

  <button type="button" class="chat-bubble" id="chat-bubble" aria-label="Ouvrir le chat" aria-expanded="false">
    <svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true" focusable="false">
      <line x1="24" y1="3" x2="24" y2="9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      <circle cx="24" cy="3" r="2.2" fill="currentColor" />
      <rect x="3.5" y="18" width="6" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
      <rect x="38.5" y="18" width="6" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
      <rect x="9.5" y="9" width="29" height="27" rx="9" fill="none" stroke="currentColor" stroke-width="2" />
      <rect x="15" y="18" width="18" height="9" rx="4" fill="none" stroke="currentColor" stroke-width="1.8" />
      <circle cx="20" cy="22.5" r="1.8" fill="currentColor" />
      <circle cx="28" cy="22.5" r="1.8" fill="currentColor" />
      <line x1="18" y1="31" x2="18" y2="34" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      <line x1="24" y1="31" x2="24" y2="34" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      <line x1="30" y1="31" x2="30" y2="34" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
  </button>

  <div class="chat-panel" id="chat-panel" hidden>
    <div class="chat-panel-header">
      <span>Assistant produits &amp; stock</span>
      <button type="button" class="chat-panel-close" id="chat-panel-close" aria-label="Fermer le chat">&times;</button>
    </div>

    <div class="thread" id="chat-thread" aria-live="polite">

      <div class="bubble bubble--bot">
        <p>Bonjour ! Posez-moi une question sur les produits ou le stock.</p>
      </div>
    </div>
    <form class="composer" id="chat-form">
      <input type="text" id="chat-input" placeholder="Poser une question sur le stock…" autocomplete="off" />
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
